name: bootimg-only

# Repack the boot image from artifacts that already exist, without rebuilding the kernel.
#
# The full build-kernel pipeline spends ~35 macOS minutes on the kernel job, which only
# changes when patches, the defconfig or the XNU/prelink inputs change. Everything after
# that - payload volume, boot image - is a few minutes of Ubuntu work. This workflow
# downloads vermeer-kernel and vermeer-firmware from an earlier run and redoes only the
# last two steps, so a boot argument or ADT tweak costs minutes instead of an hour.
#
# Inputs:
#   source_run      id of a build-kernel run that produced both artifacts
#   unique_chip_id  platform seed for the ADT (8-byte hex); defaults to the QEMU seed

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Run id that produced vermeer-kernel and vermeer-firmware'
        required: true
      unique_chip_id:
        description: 'Platform seed (8-byte hex) for the ADT'
        required: false
        default: '0000000000000001'

permissions:
  actions: read
  contents: read

jobs:
  bootimg:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout device repository (UniXNU-vermeer)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium device firmware (uefi-vermeer)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          submodules: recursive
          path: uefi

      - name: Download the prelinked kernel from the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/vermeer/kernel
          gh run download "${{ inputs.source_run }}" -R "${{ github.repository }}" \
            -n vermeer-kernel -D out/vermeer/kernel
          ls -l out/vermeer/kernel

      - name: Download the firmware volume from the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p firmware-artifact
          gh run download "${{ inputs.source_run }}" -R "${{ github.repository }}" \
            -n vermeer-firmware -D firmware-artifact
          find firmware-artifact -name 'SILICIUM_UEFI.fd' -print

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build device-tree-compiler mtools \
            python3 python3-pip clang lld llvm git curl
          python3 -m pip install --break-system-packages -r uefi/pip-requirements.txt

      - name: Provide unversioned LLVM tools
        run: |
          mkdir -p "$HOME/llvm-bin"
          for tool in llvm-nm llvm-objcopy llvm-size llvm-readelf llvm-ar llvm-strip ld.lld clang; do
            found="$(command -v "$tool" || true)"
            if [ -z "$found" ]; then
              found="$(compgen -c "$tool-" | sort -V | tail -n 1 || true)"
              found="$(command -v "$found" || true)"
            fi
            if [ -z "$found" ]; then
              echo "::error::Cannot find $tool"
              exit 1
            fi
            ln -sf "$found" "$HOME/llvm-bin/$tool"
          done
          echo "$HOME/llvm-bin" >> "$GITHUB_PATH"

      - name: Place the firmware volume where the driver expects it
        run: |
          mkdir -p "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV"
          cp "$(find firmware-artifact -name 'SILICIUM_UEFI.fd' | head -n 1)" \
             "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"
          ls -l "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Configure (defconfig vermeer)
        run: |
          python3 unixnu/unixnu defconfig vermeer_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build the payload volume
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --kernel "$GITHUB_WORKSPACE/out/vermeer/kernel/kernel.macho" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID"

      - name: Pack the boot image (BootShim + FD + DTB + payload)
        run: |
          python3 unixnu/unixnu bootimg \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --dtb "$GITHUB_WORKSPACE/scripts/data/vermeer.dtb"

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-boot
          path: |
            out/vermeer/boot/boot.img
            out/vermeer/boot/boot.json
            out/vermeer/payload/payload.img
            out/vermeer/payload/payload.json
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-bootimg-logs
          path: out/vermeer/logs/
          if-no-files-found: warn
