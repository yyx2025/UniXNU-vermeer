name: build-kernel

# Build the flashable artifacts for Redmi K70 (vermeer) on GitHub runners.
#
# kernel (macos-14)   XNU + prelink -> out/vermeer/kernel/kernel.macho
#                     (needs xcodebuild's iphoneos SDK and the Homebrew LLVM/LLD toolchain)
# firmware (ubuntu)   Mu-Silicium vermeerPkg -> Build/vermeerPkg/<target>_CLANGPDB/FV/SILICIUM_UEFI.fd
#                     (EDK II CLANGPDB; aarch64-linux-gnu- supplies the binutils EDK II expects)
# bootimg (ubuntu)    package + payload + bootimg -> out/vermeer/boot/boot.img
#                     (BootShim + FD, gzip, the device DTB with the splash node, payload ramdisk)
#
# Layout on the runner:
#   $GITHUB_WORKSPACE          this device repository (UniXNU-vermeer, passed via -D)
#   $GITHUB_WORKSPACE/unixnu   UniXNU build system checkout (submodules: recursive)
#   $GITHUB_WORKSPACE/uefi     uefi-vermeer checkout (--uefi)
#   $GITHUB_WORKSPACE/out      build output (--out)
#
# The IPSW is NOT downloaded in full: ipsw.py range-reads the kernelcache and the other
# components listed in board.toml [ipsw] fetch straight from the Apple CDN; out/ipsw is
# cached between runs.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      unique_chip_id:
        description: 'Platform seed for the device tree (8-byte hex). Empty = the payload step is skipped.'
        required: false
        default: ''

jobs:
  kernel:
    # xnu-10063.141.1 expects the Xcode 16 tools: mig gained -mach_msg2 there, and the
    # DriverKit iig output of the 15.x toolchain does not compile against 141.1's headers
    # (OSObject.iig.cpp used IORPCMessageFromMach without a declaration). macos-15 ships
    # Xcode 16.x; macos-14 defaults to 15.4.
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout device repository (UniXNU-vermeer)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          # Fork, not UniXNU/UniXNU upstream: the vermeer-fix branch carries the
          # XNU_NATIVE_LEGACY_DISPLAY guard on the mobile-graphics legacy display probe that
          # this board needs (it builds without the legacy display archive).
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Install build dependencies
        run: |
          brew install git make cmake ninja unifdef llvm lld

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find mig
          mig -help 2>&1 | grep -c mach_msg2 || true
          clang --version
          python3 --version
          ls /opt/homebrew/opt/llvm/bin/clang /opt/homebrew/opt/lld/bin/ld.lld

      - name: Cache IPSW components
        uses: actions/cache@v4
        with:
          path: out/ipsw
          key: ipsw-${{ runner.os }}-${{ hashFiles('board.toml') }}

      - name: Configure (defconfig vermeer)
        run: |
          python3 unixnu/unixnu defconfig vermeer_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build kernel (XNU + prelink, kernelcache from the IPSW)
        env:
          # prepare-xnu-source.py falls back to the GitHub contents API only when git cannot
          # reach the reference; the token keeps that fallback out of the shared rate-limit bucket.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build kernel -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Upload prelinked kernel
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel
          path: |
            out/vermeer/kernel/kernel.macho
            out/vermeer/kernel/kernel.macho.json
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel-logs
          path: out/vermeer/logs/
          if-no-files-found: warn

  os-root:
    # Off by default: this job is stage B. It needs the storage ABI recorded from a live
    # device (build/storage-abi/interface-audit.json) and the volume policies that
    # scripts/build-os-root.py expects, none of which a clean checkout carries - so it
    # fails at its payload step today and holds a 360-minute macOS runner while doing it.
    # It is also not a dependency of bootimg. Turn it on with the repository variable
    # UNIXNU_ENABLE_OS_ROOT=1 once the observation exists for this board.
    if: vars.UNIXNU_ENABLE_OS_ROOT == '1'
    # Build the inputs the verified-root profile names, then the kernel that
    # force-loads them. This is the job that exercises the storage-ABI step:
    # NativeUfs is compiled with -DNATIVE_VERIFIED_BLOCK=1 unconditionally, so
    # without libVerifiedRootProbe.a the link ends with _vr_* and
    # IOBlockStorageDevice undefined.
    #
    # Runs on macOS because scripts/build-storage-abi.py and build-os-root.py
    # need xcrun (nm, dwarfdump), hdiutil and diskutil, and because the storage
    # ABI is captured by booting the candidate kernel in QEMU once.
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout device repository (UniXNU-vermeer)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Install build dependencies
        run: |
          brew install git make cmake ninja unifdef llvm lld qemu openssl@3 dtc

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          python3 --version
          qemu-system-aarch64 --version | head -n 1

      # The storage ABI observation boots the unverified kernel: the verified
      # profile cannot link until build-os-root.py has produced its archive, so
      # this job configures twice, exactly like the qemu bring-up does.
      - name: Configure (defconfig vermeer, for the storage ABI)
        run: |
          python3 unixnu/unixnu defconfig vermeer_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Checkout Mu-Silicium (BootShim, mkbootimg, panic-screen font)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          path: uefi
          submodules: false

      - name: Cache the IPSW and its extracted volumes
        uses: actions/cache@v4
        with:
          path: |
            out/ipsw
            .cache/firmware
          key: ipsw-volumes-vermeer-${{ hashFiles('board.toml') }}-v1

      # extract-target-volume.py opens the zip directly, so it needs the whole
      # file rather than the range-read members the kernel step uses.
      - name: Download the board IPSW
        run: |
          mkdir -p ipsw
          ipsw=ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          if [ ! -s "$ipsw" ]; then
            curl -fL --retry 3 --retry-delay 5 \
              "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
              -o "$ipsw"
          fi
          ls -l "$ipsw"

      # IOStorageFamily is not named by any build step (UniXNU#7): this repository's
      # feeds.toml declares it and the fetch puts it under out/feeds, where
      # build-storage-abi.py links it into refer/IOStorageFamily.
      - name: Fetch the Apple reference sources (including IOStorageFamily)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily \
                          -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      # build-os-root.py boots the candidate kernel in QEMU to record the storage
      # ABI, so package, kernel and payload must exist first.
      # board.toml marks the platform seed as required for the payload, and the
      # ADT generator refuses a zero chip id, so the observation run uses the
      # fixed non-zero seed the qemu bring-up uses. It only affects the DT's
      # software identity, not the ABI.
      - name: Build package and kernel (vermeer_defconfig, for the storage ABI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build package kernel \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build payload (vermeer_defconfig)
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --unique-chip-id 0000000000000001

      - name: Extract the OS trust cache member
        # build-original-system-trust.py reads the OS volume's companion trust
        # cache from out/ipsw/<build>/. That file is a zip member
        # (Firmware/<dmg>.trustcache) and not a manifest component, so
        # "unixnu ipsw fetch" never extracts it.
        run: |
          python3 scripts/extract-ipsw-member.py \
            "$GITHUB_WORKSPACE/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
            044-76040-038.dmg.trustcache "$GITHUB_WORKSPACE/out/ipsw/21H461"

      - name: Build the OS root inputs (storage ABI, policies, seed, trust cache)
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          set -o pipefail
          cd out/vermeer/tree
          python3 scripts/build-os-root.py \
            --ipsw "$GITHUB_WORKSPACE/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw" \
            --openssl-prefix "$(brew --prefix openssl@3)" 2>&1 | tee "$GITHUB_WORKSPACE/os-root.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            printf '%s\n' '::group::build-os-root.py tail'
            tail -n 120 "$GITHUB_WORKSPACE/os-root.log"
            printf '%s\n' '::endgroup::'
            tail -n 20 "$GITHUB_WORKSPACE/os-root.log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::os-root: ${line}"
            done
            exit "$status"
          fi

      # The Data seed's volume UUID is generated, not stored: pass it through to
      # the verified kernel exactly as the qemu bring-up does.
      - name: Configure (defconfig vermeer_verified)
        run: |
          volume=$(python3 -c "import json;print(json.load(open('out/vermeer/tree/.cache/firmware/owner-data/seed.json'))['volume_uuid'])")
          printf 'XNU_OWNER_DATA_VOLUME_UUID=%s\n' "$volume" >> "$GITHUB_ENV"
          python3 unixnu/unixnu defconfig vermeer_verified_defconfig \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build kernel with the verified-root archive linked in
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build kernel \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Report whether the link resolved the storage symbols
        if: always()
        run: |
          log=out/vermeer/logs/kernel.log
          if [ ! -f "$log" ]; then
            echo '::error::kernel.log missing'
            exit 0
          fi
          if grep -q 'Undefined symbols' "$log"; then
            printf '%s\n' '::group::undefined symbols'
            sed -n '/Undefined symbols/,/ld: symbol(s) not found/p' "$log" | head -n 80
            printf '%s\n' '::endgroup::'
            echo '::error::the link still has undefined symbols'
          else
            echo 'link resolved every symbol'
          fi

      - name: Upload the verified-root kernel
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel-verified
          path: |
            out/vermeer/kernel/kernel.macho
            out/vermeer/kernel/kernel.macho.json
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-os-root-logs
          path: |
            os-root.log
            out/vermeer/logs/
          if-no-files-found: warn

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout device repository (UniXNU-vermeer)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium device firmware (uefi-vermeer)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          submodules: recursive
          path: uefi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm uuid-dev gettext python3 python3-pip \
            clang lld llvm gcc-aarch64-linux-gnu device-tree-compiler git curl
          python3 -m pip install --break-system-packages -r uefi/pip-requirements.txt

      - name: Show toolchain
        run: |
          python3 --version
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Configure (defconfig vermeer)
        run: |
          python3 unixnu/unixnu defconfig vermeer_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build package and firmware (vermeerPkg -> SILICIUM_UEFI.fd)
        env:
          # EDK II CLANGPDB expects the aarch64 binutils under this prefix.
          CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The board preflight (scripts/check-vermeer.py) cross-checks MemoryMapLib against
          # the stock uefiplat.cfg and needs the Mu-Silicium checkout; it reads UNIXNU_UEFI
          # because the driver runs preflight without --uefi.
          UNIXNU_UEFI: ${{ github.workspace }}/uefi
        run: |
          python3 unixnu/unixnu build package firmware \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi"

      - name: Upload firmware volume
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-firmware
          path: |
            uefi/Build/vermeerPkg/*/FV/SILICIUM_UEFI.fd
            out/vermeer/package/Build/Out/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-firmware-logs
          path: |
            out/vermeer/logs/
            uefi/Build/vermeerPkg/*/AARCH64/*.txt
          if-no-files-found: warn

  bootimg:
    runs-on: ubuntu-24.04
    needs: [kernel, firmware]
    timeout-minutes: 60

    steps:
      - name: Checkout device repository (UniXNU-vermeer)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/UniXNU
          ref: vermeer-fix
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium device firmware (uefi-vermeer)
        uses: actions/checkout@v4
        with:
          repository: yyx2025/uefi-vermeer
          ref: vermeer
          submodules: recursive
          path: uefi

      - name: Download the prelinked kernel
        uses: actions/download-artifact@v4
        with:
          name: vermeer-kernel
          path: out/vermeer/kernel

      - name: Download the firmware volume
        uses: actions/download-artifact@v4
        with:
          name: vermeer-firmware
          path: firmware-artifact

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build device-tree-compiler mtools \
            python3 python3-pip clang lld llvm git curl
          python3 -m pip install --break-system-packages -r uefi/pip-requirements.txt

      - name: Provide unversioned LLVM tools
        # Ubuntu installs llvm-nm-18, llvm-objcopy-18, ... while the board scripts look up
        # llvm-nm / llvm-objcopy / llvm-size / llvm-readelf by name (scripts/patch-xnu-entry-probe.py
        # and unixnu/payload.py both do). Link the unversioned names the scripts expect.
        run: |
          mkdir -p "$HOME/llvm-bin"
          for tool in llvm-nm llvm-objcopy llvm-size llvm-readelf llvm-ar llvm-strip ld.lld clang; do
            found="$(command -v "$tool" || true)"
            if [ -z "$found" ]; then
              found="$(compgen -c "$tool-" | sort -V | tail -n 1 || true)"
              found="$(command -v "$found" || true)"
            fi
            if [ -z "$found" ]; then
              echo "::error::Cannot find $tool"
              exit 1
            fi
            ln -sf "$found" "$HOME/llvm-bin/$tool"
            echo "$tool -> $found"
          done
          echo "$HOME/llvm-bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          llvm-nm --version | head -n 1
          fdtput --version | head -n 1
          mformat --version 2>&1 | head -n 1

      - name: Place the firmware volume where the driver expects it
        run: |
          mkdir -p "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV"
          cp firmware-artifact/uefi/Build/vermeerPkg/*/FV/SILICIUM_UEFI.fd \
             "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"
          ls -l "uefi/Build/vermeerPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Configure (defconfig vermeer)
        run: |
          python3 unixnu/unixnu defconfig vermeer_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build the payload volume
        env:
          # The platform seed is not stored in any repository (board.toml [payload.adt]
          # unique_chip_id = "required"). Supply it as a workflow input or a repository
          # secret; without it the payload cannot be written.
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id || secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${UNIXNU_UNIQUE_CHIP_ID}" ]; then
            echo "::warning::No --unique-chip-id (workflow input or UNIXNU_UNIQUE_CHIP_ID secret); skipping the payload and the boot image"
            exit 0
          fi
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --kernel "$GITHUB_WORKSPACE/out/vermeer/kernel/kernel.macho" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID"

      - name: Pack the boot image (BootShim + FD + DTB + payload)
        run: |
          if [ ! -f out/vermeer/payload/payload.img ]; then
            echo "::warning::No payload volume; skipping bootimg"
            exit 0
          fi
          python3 unixnu/unixnu bootimg \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --dtb "$GITHUB_WORKSPACE/scripts/data/vermeer.dtb"

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-boot
          path: |
            out/vermeer/boot/boot.img
            out/vermeer/boot/boot.json
            out/vermeer/payload/payload.img
            out/vermeer/payload/payload.json
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-bootimg-logs
          path: out/vermeer/logs/
          if-no-files-found: warn
